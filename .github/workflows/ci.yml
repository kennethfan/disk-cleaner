name: CI

on:
  push:
  pull_request:
  # 允许在 Actions 页面点按钮手动跑一次。用途：被 arm64 runner 容量卡掉
  # （job 结论 cancelled、steps 为 0）时，网页上直接重跑，不必装 gh 或
  # 本地建空提交。命令行等价物是 `gh run rerun <run-id>`。
  workflow_dispatch:

jobs:
  check:
    # 必须用 macOS：代码直接依赖 darwin 的 syscall（Statfs、废纸篓），
    # WebView 壳还要 cgo，Linux 上无法编译。
    #
    # 标签钉在 macOS 15 而不是 macos-latest：latest 会漂移（现为 macOS 26），
    # 一旦漂移，CI 验的 SDK 与最低系统版本就和 release.yml 的两个 runner
    # （macos-15 / macos-15-intel）不是同一代，出现「CI 绿但发布产物有别」。
    #
    # 注意：macos-15 与 macos-latest 都是 arm64，换标签解决的是版本漂移，
    # 不解决 arm64 runner 的排队问题（GitHub 官方对 arm64 有容量提示）。
    # 真被排队卡住时用 `gh run rerun <run-id>` 重试，而不是改这里的标签。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 与本地 make check 完全一致：gofmt -l、go vet、go test
      - name: 格式检查 + 静态检查 + 单元测试
        run: make check

      - name: 构建命令行二进制
        run: make build

      # ad-hoc 签名在 macos runner 上无需证书即可完成。
      - name: 打包 .app
        run: make app

      # 光有产物不够：二进制要能跑起来，.app 要能被 codesign 验过才穿得过 Gatekeeper。
      - name: 验证产物
        run: |
          ./bin/disk-cleaner help
          test -x "dist/磁盘清理.app/Contents/MacOS/disk-cleaner"
          test -f "dist/磁盘清理.app/Contents/Resources/AppIcon.icns"
          codesign --verify --deep --strict "dist/磁盘清理.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "dist/磁盘清理.app/Contents/Info.plist"
